name: Update Restaurants

on:
  schedule:
    - cron: '0 6 * * *' # daily 08:00 SA time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Scrape restaurants
        run: python scrapers/scrape_restaurants.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/restaurants.json
          # Only commit if there are actually changes - this is the fix
          # Old version failed here when there was nothing new to commit
          if git diff --cached --quiet; then
            echo "No changes - nothing to commit"
            exit 0
          fi
          git commit -m "Update restaurants - $(date -u +%Y-%m-%d)"
          git push