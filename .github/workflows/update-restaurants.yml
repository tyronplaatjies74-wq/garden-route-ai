name: Update Restaurants

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scrapers/scrape_restaurants.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/restaurants.json
          git commit -m "Auto-update restaurants" || echo "No changes"
          git push