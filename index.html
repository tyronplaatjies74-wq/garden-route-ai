<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden Route AI | Live Guide</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(ellipse at 20% 12%,rgba(70,100,130,.45) 0%,transparent 45%),
      radial-gradient(ellipse at 85% 70%,rgba(60,50,80,.35) 0%,transparent 50%),
      linear-gradient(180deg,#3a4a60 0%,#1d2b3a 35%,#18232e 70%,#1c2430 100%);
    background-attachment:fixed;
    color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding-bottom:110px}
  header{background:#000;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;position:sticky;top:0;z-index:20;border-bottom:1px solid #222}
  header h1{font-size:22px;display:flex;align-items:center;gap:10px}
  header h1 span{color:#2f8cf0}
  .menu-btn{font-size:26px;background:none;border:none;color:#fff;cursor:pointer;padding:0 6px}
  .menu{position:absolute;top:56px;right:12px;background:#141c33;border:1px solid #2a3556;border-radius:16px;padding:8px;width:230px;display:none;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .menu.show{display:block}
  .menu button{display:block;width:100%;text-align:left;background:none;border:none;color:#fff;padding:12px;border-radius:10px;font-size:15px;cursor:pointer}
  .menu button:hover{background:#1f2a48}
  .wrap{padding:16px}
  .card{background:rgba(20,28,52,.94);border:1px solid rgba(255,255,255,.06);border-radius:28px;padding:26px 26px;margin:12px 0;max-width:86%;line-height:1.7}
  .card p{font-size:19px;color:#fff;margin-bottom:22px}
  .card p:last-child{margin-bottom:0}
  .ai-card{background:rgba(20,28,52,.94);border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:20px;margin:12px 0}
  .ai-card h3{font-size:18px;margin-bottom:10px}
  .ai-card p{line-height:1.6;color:#d6def0;font-size:16px;margin-bottom:8px}
  .ai-card a{color:#7db8ff}
