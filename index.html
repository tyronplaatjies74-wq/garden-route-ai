<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden Route AI | Live Guide</title>
<style>
body{margin:0;font-family:system-ui,Arial;background:#0f2a3a;color:#fff}
header{padding:16px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
header span{color:#4ade80}
.wrap{padding:0 14px 100px}
.pill{display:inline-block;background:#1a3a4d;padding:6px 10px;border-radius:20px;font-size:12px;margin:3px}
#chat{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.msg{padding:14px;border-radius:16px;line-height:1.5;font-size:15px}
.user{align-self:flex-end;background:#f97316;max-width:85%}
.bot{align-self:flex-start;background:#1e3a4a;width:100%;box-sizing:border-box}
.card{background:#0b2230;border:1px solid #2a4a5e;border-radius:14px;padding:14px;margin-top:10px}
.card h3{margin:0 0 6px;color:#facc15;font-size:16px}
.card p{margin:4px 0;color:#cbd5e1;font-size:14px}
.card img{width:100%;border-radius:10px;margin-top:8px}
a{color:#60a5fa}
button{border:0;cursor:pointer}
.save{background:#334155;color:#fff;padding:7px 12px;border-radius:20px;margin-top:8px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#0f2a3a;padding:10px;display:flex;gap:8px;border-top:1px solid #2a4a5e}
.bar input{flex:1;padding:13px;border-radius:30px;border:0;background:#1e3a4a;color:#fff;outline:none}
.bar button{background:#f97316;color:#fff;padding:0 22px;border-radius:30px;font-weight:700}
</style>
</head>
<body>
<header>🌿 Garden Route AI <span>✓</span></header>
<div class="wrap">
<div>
<span class="pill">Saved</span><span class="pill">Emergency</span><span class="pill">Weather</span><span class="pill">Budget</span><span class="pill">Highlights</span>
</div>
<div id="chat">
<div class="msg bot">Hi! Ask me anything. Try: <b>About Knysna</b> or <b>2-day itinerary in George</b> or <b>Events in Knysna</b></div>
</div>
</div>
<div class="bar">
<input id="q" placeholder="Ask for an itinerary... e.g. 2 days in George" />
<button onclick="ask()">Ask</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('q');
input.addEventListener('keydown', e=>{ if(e.key==='Enter') ask(); });

function addMsg(text, who='bot', isHtml=false){
  const d=document.createElement('div');
  d.className='msg '+who;
  if(isHtml) d.innerHTML=text; else d.textContent=text;
  chat.appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
  return d;
}

async function getWikipedia(place){
  try{
    const clean = place.trim();
    if(!clean) return null;
    const res = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(clean));
    if(!res.ok) return null;
    const data = await res.json();
    if(!data.extract) return null;
    return {
      title: data.title,
      extract: data.extract,
      image: data.thumbnail ? data.thumbnail.source : null,
      link: data.content_urls && data.content_urls.desktop ? data.content_urls.desktop.page : 'https://en.wikipedia.org/wiki/' + encodeURIComponent(clean)
    };
  }catch(e){ return null; }
}

function showWiki(data, place){
  // remove loading message
  const last = chat.lastChild;
  if(last && last.textContent.includes('Looking up')) last.remove();
  if(!data){
    addMsg('Sorry, I could not find Wikipedia info for ' + place + '. Try: About Knysna, About George, About Plettenberg Bay');
    return;
  }
  let html = '<h3>📖 ' + data.title + ' - from Wikipedia</h3><p>' + data.extract + '</p>';
  if(data.image) html += '<img src="'+data.image+'" />';
  html += '<p><a href="'+data.link+'" target="_blank">Read full article on Wikipedia →</a></p>';
  addMsg(html, 'bot', true);
}

function getEvents(place){
  const events = [
    {title:'Leisure Isle Festival - 21st Anniversary', town:'Knysna'},
    {title:'ForestJAZZ in November', town:'Knysna'},
    {title:'Radiate', town:'Knysna'},
    {title:'Knysna Oyster Festival', town:'Knysna'},
    {title:'George Arts Festival', town:'George'},
    {title:'Garden Route Botanical Garden Walk', town:'George'},
    {title:'Plett Wine & Bubbly Festival', town:'Plettenberg Bay'},
    {title:'Mossel Bay Dias Festival', town:'Mossel Bay'}
  ];
  return events.filter(e => e.town.toLowerCase() === place.toLowerCase());
}

function getItinerary(place, days){
  if(place==='george'){
    return '<h3>🗓️ '+days+'-Day Itinerary in George</h3>'
    + '<p><b>Day 1:</b> Garden Route Botanical Garden, George Museum, York Street for lunch, Outeniqua Transport Museum</p>'
    + '<p><b>Day 2:</b> Kaaimans River, Wilderness Beach, Map of Africa viewpoint, dinner on York Street</p>';
  }
  if(place==='knysna'){
    return '<h3>🗓️ '+days+'-Day Itinerary in Knysna</h3>'
    + '<p><b>Day 1:</b> Knysna Heads, Leisure Isle, Waterfront for lunch, Knysna Forest</p>'
    + '<p><b>Day 2:</b> Featherbed Nature Reserve, Thesen Island, Oyster tasting</p>';
  }
  return '<h3>🗓️ '+days+'-Day Itinerary in '+place+'</h3><p>Explore the main beach, local markets, forest walks and waterfront restaurants. Ask me About '+place+' for history first.</p>';
}

async function ask(){
  const q = input.value.trim();
  if(!q) return;
  addMsg(q, 'user');
  input.value = '';
  const lower = q.toLowerCase();

  // 1. WIKIPEDIA - MUST BE FIRST, BEFORE ANYTHING ELSE
  if(lower.includes('about') || lower.includes('tell') || lower.includes('tel me')){
    let place = lower.replace('tel me about','').replace('tell me about','').replace('about','').replace('tell','').replace('me','').replace('what is','').replace('?','').trim();
    if(!place) place = 'Knysna';
    // Capitalize first letter
    place = place.charAt(0).toUpperCase() + place.slice(1);
    addMsg('Looking up ' + place + ' on Wikipedia...');
    const data = await getWikipedia(place);
    showWiki(data, place);
    return;
  }

  // 2. ITINERARY
  if(lower.includes('itinerary') || lower.includes('day') && lower.includes('in')){
    let town = 'George';
    if(lower.includes('knysna')) town='Knysna';
    if(lower.includes('george')) town='George';
    if(lower.includes('plett')) town='Plettenberg Bay';
    if(lower.includes('mossel')) town='Mossel Bay';
    if(lower.includes('wilderness')) town='Wilderness';
    let days = 2;
    const m = lower.match(/(\d+)\s*-?\s*day/);
    if(m) days = parseInt(m[1]);
    addMsg(getItinerary(town.toLowerCase(), days), 'bot', true);
    return;
  }

  // 3. EVENTS - ONLY IF NOT WIKIPEDIA
  if(lower.includes('event') || lower.includes('what is on') || lower.includes("what's on")){
    let town = 'Knysna';
    if(lower.includes('george')) town='George';
    if(lower.includes('knysna')) town='Knysna';
    if(lower.includes('plett')) town='Plettenberg Bay';
    if(lower.includes('mossel')) town='Mossel Bay';
    const list = getEvents(town);
    let html = "Here's what I found ("+list.length+"): ";
    list.forEach(e=>{
      html += '<div class="card"><h3>'+e.title+'</h3><p>📍 '+e.town+' • 📅 See link</p><a href="#">View Details →</a><br><button class="save" onclick="this.textContent=\'♥ Saved\'">🤍 Save</button></div>';
    });
    addMsg(html, 'bot', true);
    return;
  }

  // 4. FALLBACK
  addMsg('I can help with: <b>About Knysna</b> for Wikipedia, <b>2-day itinerary in George</b>, or <b>Events in Knysna</b>. What do you want?');
}
</script>
</body>
</html>
