<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garden Route AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:#0f172a;color:white;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.top{width:100%;max-width:720px;text-align:center;padding:18px 0 8px}
.orb{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fbbf24,#f97316,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 0 40px #f9731688;animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
h1{margin:6px 0 2px;font-size:26px}
p.sub{color:#cbd5e1;margin:0 0 14px;font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.tabs button{background:#1e293b;color:white;border:1px solid #334155;padding:8px 14px;border-radius:999px;cursor:pointer;font-size:13px}
.tabs button.active{background:#f97316;border-color:#f97316}
.tabs button:disabled{opacity:.4}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.chips button{background:#1e293b;color:white;border:1px solid #334155;padding:8px 14px;border-radius:999px;cursor:pointer;font-size:13px}
.card{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:14px;width:100%;max-width:720px}
#chat{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{padding:10px 12px;border-radius:14px;max-width:88%;font-size:14px;line-height:1.5;white-space:pre-wrap}
.user{align-self:flex-end;background:#f97316}
.ai{align-self:flex-start;background:#0f172a;border:1px solid #334155}
.row{display:flex;gap:8px}
input{flex:1;padding:12px;border-radius:999px;border:1px solid #334155;background:#0f172a;color:white;outline:none}
button.send{background:#f97316;border:none;color:white;padding:12px 18px;border-radius:999px;cursor:pointer;font-weight:700}
#status{font-size:12px;color:#94a3b8;text-align:center;margin-top:8px}
.event{border:1px solid #334155;border-radius:12px;padding:10px;margin-top:8px;background:#0f172a}
.event b{color:#fbbf24}
a{color:#60a5fa}
</style>
</head>
<body>
<div class="top">
  <div class="orb">🌿</div>
  <h1>Garden Route AI</h1>
  <p class="sub">Your live guide to the Garden Route</p>
</div>

<div class="tabs">
  <button class="active">🎉 Events</button>
  <button disabled>🍽️ Restaurants • Soon</button>
  <button disabled>🛏️ Stays • Soon</button>
  <button disabled>🥾 Activities • Soon</button>
</div>

<div class="chips">
  <button onclick="ask('What is on this weekend?')">This Weekend</button>
  <button onclick="ask('Markets')">Markets</button>
  <button onclick="ask('Live music')">Live Music</button>
  <button onclick="ask('What is on in Knysna?')">Knysna</button>
  <button onclick="ask('What is on in George?')">George</button>
  <button onclick="ask('Family events')">Family Fun</button>
</div>

<div class="card">
  <div id="chat"></div>
  <div class="row">
    <input id="q" placeholder="Ask: What's on in Knysna this weekend?" onkeydown="if(event.key==='Enter')send()">
    <button class="send" onclick="send()">Ask</button>
  </div>
  <div id="status">Loading live events...</div>
</div>

<p style="font-size:11px;color:#64748b;text-align:center;margin-top:12px;">
  © Garden Route AI | T Plaatjies Trading (Pty) Ltd - Reg 2026/589356/07
</p>

<script>
let EVENTS = [];

const TOWNS = [
  'knysna', 'plett', 'plettenberg bay', 'george', 'wilderness',
  'mossel bay', 'oudtshoorn', 'sedgefield', 'buffalo bay',
  "nature's valley", 'natures valley', 'storms river',
  'great brak', 'little brak', 'herolds bay', 'victoria bay',
  'brenton', 'belvidere', 'rheenendal'
];

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function startOfDay(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return x;
}

function parseEventDate(e) {
  const raw = e.date || e.date_text || e.when || '';
  if (!raw) return null;

  // Native parse first
  let d = new Date(raw);
  if (!isNaN(d.getTime())) return d;

  // Strip ordinals (1st, 2nd, 3rd, 4th) and try again
  const cleaned = String(raw).replace(/(\d+)(st|nd|rd|th)/gi, '$1');
  d = new Date(cleaned);
  if (!isNaN(d.getTime())) return d;

  return null;
}

function isPast(date) {
  if (!date) return false;
  return startOfDay(date) < startOfDay(new Date());
}

function isToday(date) {
  if (!date) return false;
  return startOfDay(date).getTime() === startOfDay(new Date()).getTime();
}

function isTomorrow(date) {
  if (!date) return false;
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  return startOfDay(date).getTime() === startOfDay(tomorrow).getTime();
}

function isThisWeekend(date) {
  if (!date) return false;
  const now = new Date();
  const day = now.getDay(); // 0 = Sun ... 6 = Sat

  // Days until next Saturday (0 if today is Saturday)
  const daysToSat = (6 - day + 7) % 7;
  const sat = startOfDay(new Date(now));
  sat.setDate(now.getDate() + daysToSat);

  const sun = new Date(sat);
  sun.setDate(sat.getDate() + 1);

  const eventDay = startOfDay(date).getTime();
  return eventDay === sat.getTime() || eventDay === sun.getTime();
}

function getLink(e) {
  let link = e.link || e.url || '';
  if (!link || link === 'undefined' || link === 'null') return null;
  link = String(link).trim();
  if (link.startsWith('/') || link.startsWith('./') || !/^https?:\/\//i.test(link)) {
    return null; // treat relative / protocol-less as invalid for direct linking
  }
  return link;
}

function say(text, who, isHtml = false) {
  const c = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = 'msg ' + who;

  if (isHtml) {
    d.innerHTML = text;
  } else {
    d.textContent = text;
  }
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}

function filterEvents(q) {
  q = (q || '').toLowerCase().trim();

  // Attach parsed dates once
  let list = EVENTS.map(e => ({
    ...e,
    _date: parseEventDate(e)
  }));

  // Default: hide past events (keep undated)
  list = list.filter(e => !isPast(e._date));

  // Town filter – UNION (any matching town)
  const mentionedTowns = TOWNS.filter(t => q.includes(t));
  if (mentionedTowns.length) {
    list = list.filter(e => {
      const hay = ((e.town || '') + ' ' + (e.title || '')).toLowerCase();
      return mentionedTowns.some(t => hay.includes(t));
    });
  }

  // Intent filters
  if (/\b(today)\b/.test(q)) {
    list = list.filter(e => isToday(e._date));
  } else if (/\b(tomorrow)\b/.test(q)) {
    list = list.filter(e => isTomorrow(e._date));
  } else if (/\b(weekend|this week)\b/.test(q)) {
    list = list.filter(e => isThisWeekend(e._date));
  }

  // Keyword filters
  if (q.includes('market')) {
    list = list.filter(e => (e.title || '').toLowerCase().includes('market'));
  }
  if (/\b(music|live music|concert|band|acoustic|gig)\b/.test(q)) {
    list = list.filter(e =>
      (e.title || '').toLowerCase().match(/music|concert|band|acoustic|gig|live\s/)
    );
  }
  if (/\b(family|kids|children)\b/.test(q)) {
    list = list.filter(e =>
      (e.title || '').toLowerCase().match(/family|kids|children|market|fair/)
    );
  }
  if (q.includes('festival')) {
    list = list.filter(e => (e.title || '').toLowerCase().includes('festival'));
  }

  // Sort: soonest first, undated at the end
  list.sort((a, b) => {
    if (!a._date && !b._date) return 0;
    if (!a._date) return 1;
    if (!b._date) return -1;
    return a._date - b._date;
  });

  return list.slice(0, 8);
}

function formatDate(e) {
  if (e._date && !isNaN(e._date.getTime())) {
    return e._date.toLocaleDateString('en-ZA', {
      weekday: 'short',
      day: 'numeric',
      month: 'short',
      year: 'numeric'
    });
  }
  return e.date || e.date_text || 'See link for date';
}

function renderEvents(list) {
  if (!list.length) {
    return "I couldn't find any upcoming events for that search right now.\n\nTry: \"Knysna\", \"Markets\", \"Live music\", or \"This weekend\".\n\nI refresh every few hours from public listings across the Garden Route.";
  }

  let out = `Found ${list.length} upcoming event${list.length === 1 ? '' : 's'}:\n`;

  list.forEach(e => {
    const title = escapeHtml(e.title || 'Untitled event');
    const town  = escapeHtml(e.town || 'Garden Route');
    const dateStr = escapeHtml(formatDate(e));
    let link = getLink(e);

    if (!link) {
      const q = encodeURIComponent((e.title || '') + ' ' + (e.town || '') + ' Garden Route');
      link = `https://www.google.com/search?q=${q}`;
    } else {
      link = escapeHtml(link);
    }

    out += `\n<div class="event"><b>${title}</b><br>📍 ${town} • 📅 ${dateStr}<br><a href="${link}" target="_blank" rel="noopener">View Full Details →</a></div>`;
  });

  return out;
}

function ask(q) {
  document.getElementById('q').value = q;
  send();
}

function send() {
  const inp = document.getElementById('q');
  const q = inp.value.trim();
  if (!q) return;

  say(q, 'user');          // safe – textContent
  inp.value = '';

  const list = filterEvents(q);
  const html = renderEvents(list);
  say(html, 'ai', true);   // structured HTML, already escaped
}

async function load() {
  const statusEl = document.getElementById('status');
  statusEl.textContent = 'Loading live events...';

  try {
    const r = await fetch('data/events.json?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();

    EVENTS = j.events || [];

    // Deduplicate by normalised title
    const seen = new Set();
    EVENTS = EVENTS.filter(e => {
      const k = (e.title || '').toLowerCase().replace(/\s+/g, ' ').trim();
      if (!k || seen.has(k)) return false;
      seen.add(k);
      return true;
    });

    let statusText = `Live • ${EVENTS.length} events`;
    if (j.last_updated) {
      const updated = new Date(j.last_updated);
      if (!isNaN(updated.getTime())) {
        statusText += ` • Last updated: ${updated.toLocaleString()}`;
      }
    }
    statusEl.textContent = statusText;

    say("Hi! I'm Garden Route AI 🌿\nRight now I'm live for EVENTS. Restaurants, Stays & Activities are coming next.\n\nAsk me: \"What's on in Knysna this weekend?\"", 'ai');
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'No data/events.json yet – run the scraper first.';
    say("Hi! Events are still loading. Once your scraper has run I’ll show live upcoming events here.", 'ai');
  }
}

load();
</script>
</body>
</html>
